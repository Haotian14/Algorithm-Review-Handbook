name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 把 docs/*.md 重新打包进 site/assets/content.js，保证线上内容与 markdown 一致
      - name: Build content bundle
        run: node scripts/build.mjs

      # 注意：这一步要求仓库已经在 Settings → Pages 里把 Source 设成 GitHub Actions。
      # 不要加 enablement: true —— 创建 Pages 站点需要 administration 权限，
      # workflow 的 GITHUB_TOKEN 拿不到，只会报 "Resource not accessible by integration"。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
