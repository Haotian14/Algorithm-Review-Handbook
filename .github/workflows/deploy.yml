name: Deploy to GitHub Pages

on:
  push:
    # 仓库当前的默认分支就是这个开发分支，合并到 main 后同样会触发
    branches: [main, master, claude/algorithm-interview-handbook-xhqsx1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 把 docs/*.md 重新打包进 site/assets/content.js，保证线上内容与 markdown 一致
      - name: Build content bundle
        run: node scripts/build.mjs

      # enablement: true 会在仓库首次部署时自动把 Pages 的源设成 GitHub Actions，
      # 不需要再去 Settings 里手动切一次
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
