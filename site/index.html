<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>算法岗面试复习手册</title>
<meta name="description" content="面向算法岗（大模型 / 推荐搜索广告 / CV 多模态 / 通用机器学习）的校招面试复习手册：13 章系统笔记 + 130 道高频自测题 + 可运行的手撕代码。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7">
<meta property="og:title" content="算法岗面试复习手册">
<meta property="og:description" content="13 章系统笔记 · 130 道高频自测题 · 可运行的手撕代码">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23b0560f'/><text x='16' y='23' text-anchor='middle' font-size='20' font-weight='700' font-family='Georgia,Times,serif' fill='%23fff'>&#955;</text></svg>">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="reading-bar"></div>

<header class="topbar">
  <button class="icon-btn only-mobile" id="btn-menu" aria-label="打开目录">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark">λ</span>
    <span class="brand-text">
      <b>算法岗面试复习手册</b>
      <i>Algorithm Interview Handbook</i>
    </span>
  </a>

  <button class="searchbox" id="btn-search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>搜索全书…</span>
    <kbd>⌘K</kbd>
  </button>

  <div class="topbar-right">
    <button class="pill-btn accent" id="btn-quiz">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.6" cy="8.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.6" r="1.15" fill="currentColor" stroke="none"/></svg>
      <span>随机抽题</span>
    </button>
    <button class="icon-btn" id="btn-theme" aria-label="切换主题">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="progress-card">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 44 44">
          <circle class="ring-bg" cx="22" cy="22" r="19"/>
          <circle class="ring-fg" cx="22" cy="22" r="19" id="ring-fg"/>
        </svg>
        <span id="ring-label">0%</span>
      </div>
      <div class="progress-meta">
        <b>复习进度</b>
        <span id="progress-text">0 / 13 章已掌握</span>
        <button class="link-btn" id="btn-reset">重置进度</button>
      </div>
    </div>
    <nav id="nav"></nav>
    <footer class="side-foot">
      <span id="build-info"></span>
    </footer>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main id="main"></main>

  <aside class="toc" id="toc"></aside>
</div>

<!-- ------------------------------------------------------------- 搜索面板 -->
<div class="overlay" id="search-overlay" hidden>
  <div class="palette">
    <div class="palette-input">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="搜索知识点、题目、代码…" autocomplete="off" spellcheck="false">
      <kbd>ESC</kbd>
    </div>
    <div class="palette-results" id="search-results"></div>
  </div>
</div>

<!-- ------------------------------------------------------------- 抽题面板 -->
<div class="overlay" id="quiz-overlay" hidden>
  <div class="quiz">
    <header class="quiz-head">
      <div class="quiz-filters" id="quiz-filters"></div>
      <button class="icon-btn" id="quiz-close" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="quiz-body" id="quiz-body"></div>

    <footer class="quiz-foot">
      <div class="quiz-stat" id="quiz-stat"></div>
      <div class="quiz-actions" id="quiz-actions"></div>
    </footer>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
